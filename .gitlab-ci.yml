stages:
  - verify
  - security

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

repository-verify:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - node tools/ci/verify-repository.mjs

ci-verify:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:8.0.423
  variables:
    CAO_CI_ARTIFACT_DIR: "$CI_PROJECT_DIR/.cao-ci-artifact"
  cache:
    key:
      files:
        - Source/packages.lock.json
    paths:
      - .nuget/packages
  script:
    - bash tools/ci/verify-dotnet.sh
  artifacts:
    name: "colonist-awareness-verified-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - .cao-ci-artifact/

dependency-scan:
  stage: security
  image: mcr.microsoft.com/dotnet/sdk:8.0.423
  cache:
    key:
      files:
        - Source/packages.lock.json
    paths:
      - .nuget/packages
  script:
    - dotnet restore Source/ColonistAwareness.csproj --locked-mode --nologo
    - dotnet list Source/ColonistAwareness.csproj package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - nuget-vulnerabilities.json
